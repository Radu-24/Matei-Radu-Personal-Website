<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Not found · Radu Matei</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#05060B">
<!-- GitHub Pages serves this file for any address that doesn't exist, at that address. So relative links would break
     (/a/b/ would look for /a/b/assets/...). The script below finds the site's root first: "/" on radumatei.ro,
     "/Radu-Matei/" on radu-24.github.io, and loads the icon and fonts from there. -->
<script>
  (() => {
    const gh = location.hostname.endsWith('github.io'), seg = location.pathname.split('/')[1];
    const root = gh && seg ? '/' + seg + '/' : '/';
    window.SITE_ROOT = root;
    const add = (rel, href, type) => { const l = document.createElement('link'); l.rel = rel; l.href = root + href; if (type) l.type = type; document.head.appendChild(l) };
    add('icon', 'assets/img/favicon.svg', 'image/svg+xml'); add('apple-touch-icon', 'assets/img/apple-touch-icon.png'); add('stylesheet', 'assets/css/fonts.css');
  })();
</script>
<style>
:root{--bg:#05060B;--fg:#EEF0F8;--muted:#8C92A6;color-scheme:dark;
  --sans:"Instrument Sans",-apple-system,system-ui,sans-serif;--mono:"IBM Plex Mono",ui-monospace,monospace}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);line-height:1.55;display:grid;place-items:center;overflow:hidden;
  padding:24px calc(24px + env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) calc(24px + env(safe-area-inset-left,0px))}
/* two soft colour pools, like the home page */
body::before,body::after{content:"";position:fixed;width:90vmax;height:90vmax;border-radius:50%;pointer-events:none;z-index:-1}
body::before{left:-40vmax;top:-45vmax;background:radial-gradient(closest-side,rgba(255,90,106,.22),rgba(255,90,106,.06) 55%,transparent)}
body::after{right:-45vmax;bottom:-50vmax;background:radial-gradient(closest-side,rgba(77,200,255,.18),rgba(77,200,255,.05) 55%,transparent)}
main{text-align:center;max-width:520px}
/* the prism: white light comes in from the left; nothing comes out, because this page isn't here */
.scene{width:min(300px,80vw);margin:0 auto 6px;display:block;overflow:visible}
.beam{stroke:#fff;stroke-width:2.2;stroke-linecap:round;stroke-dasharray:6 9;animation:flow 1.6s linear infinite;opacity:.85}
.prism{fill:url(#glass);stroke:url(#edge);stroke-width:2.6;stroke-linejoin:round;transform-origin:150px 74px;animation:wobble 5s ease-in-out infinite}
.lost{stroke:url(#spec);stroke-width:2.2;stroke-linecap:round;stroke-dasharray:2 10;opacity:.55;animation:flow 2.4s linear infinite reverse}
@keyframes flow{to{stroke-dashoffset:-30}}
@keyframes wobble{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
h1{margin:0;font-size:clamp(84px,22vw,150px);line-height:.95;letter-spacing:-.06em;font-weight:700;
  background:linear-gradient(180deg,#fff 10%,#9aa3bd);-webkit-background-clip:text;background-clip:text;color:transparent}
p{margin:14px 0 0;color:#C2C7D4;font-size:17px}
.k{font-family:var(--mono);font-size:12.5px;color:var(--muted);letter-spacing:.04em;word-break:break-all;margin-top:10px}
a.btn{display:inline-flex;align-items:center;gap:10px;margin-top:28px;padding:13px 24px;border-radius:999px;font-weight:600;font-size:15px;text-decoration:none;color:#07080D;
  background:radial-gradient(120% 150% at 28% -10%,rgba(255,255,255,.55),transparent 55%),linear-gradient(180deg,#ff8a95,#FF5A6A 58%,#e04a59);
  box-shadow:inset 1px 1px 0 rgba(255,255,255,.6),0 10px 30px -10px rgba(255,90,106,.7);transition:scale .4s cubic-bezier(.3,1.6,.5,1)}
a.btn:hover{scale:1.04}
a.btn:focus-visible{outline:2px solid #fff;outline-offset:3px}
@media (prefers-reduced-motion:reduce){.beam,.prism,.lost{animation:none}}
</style>
</head>
<body>
<main>
  <svg class="scene" viewBox="0 0 300 140" aria-hidden="true">
    <defs>
      <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FF5A6A"/><stop offset=".5" stop-color="#FFE14D"/><stop offset="1" stop-color="#4DC8FF"/></linearGradient>
      <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".28"/><stop offset="1" stop-color="#b9c5ff" stop-opacity=".06"/></linearGradient>
      <linearGradient id="spec" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FF5A6A"/><stop offset=".5" stop-color="#5CF59A"/><stop offset="1" stop-color="#9B7BFF"/></linearGradient>
    </defs>
    <line class="beam" x1="6" y1="96" x2="120" y2="80"/>
    <polygon class="prism" points="150,20 196.8,101 103.2,101"/>
    <line class="lost" x1="182" y1="78" x2="294" y2="118"/>
  </svg>
  <h1>404</h1>
  <p>This page isn't here. The light went somewhere else.</p>
  <div class="k" id="path"></div>
  <a class="btn" id="home" href="/">Back home</a>
</main>
<script>
  document.getElementById('home').href = window.SITE_ROOT || '/';
  document.getElementById('path').textContent = location.pathname;
</script>
</body>
</html>
