<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- the tab icon: the island's prism, its edge lit with the site's page colours -->
  <defs>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF5A6A"/><stop offset=".5" stop-color="#FFE14D"/><stop offset="1" stop-color="#4DC8FF"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".3"/><stop offset="1" stop-color="#b9c5ff" stop-opacity=".08"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="15" fill="#0B0D14" stroke="#fff" stroke-opacity=".14" stroke-width="2"/>
  <polygon points="32,12 51.05,45 12.95,45" fill="url(#glass)" stroke="url(#edge)" stroke-width="4.5" stroke-linejoin="round"/>
</svg>
